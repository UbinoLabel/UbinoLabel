backend:
  name: github
  repo: ubinolabel/UbinoLabel
  branch: main

site_url: https://ubinolabel.netlify.app
display_url: https://ubinolabel.netlify.app
locale: fr
media_folder: images/uploads
public_folder: /images/uploads

collections:
  - name: articles
    label: Articles
    files:
      - name: liste
        label: Tous les articles
        file: articles.json
        format: json
        fields:
          - label: Articles
            name: articles
            widget: list
            label_singular: article
            summary: "{{fields.title}} ({{fields.date}})"
            fields:
              - { label: Titre, name: title, widget: string }
              - { label: Date de publication, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
              - { label: Texte, name: text, widget: text, hint: "Séparez les paragraphes par une ligne vide." }
